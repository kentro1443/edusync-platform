name: edusync

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: edusync
      POSTGRES_USER: edusync
      POSTGRES_PASSWORD: edusync_local
    ports:
      - "5432:5432"
    volumes:
      - edusync-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edusync -d edusync"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - edusync-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  edusync-postgres-data:
  edusync-redis-data: